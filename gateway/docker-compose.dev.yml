version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railway-postgres
    environment:
      POSTGRES_DB: railway_gateway
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: railway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: railway
      RABBITMQ_DEFAULT_PASS: railway_secret
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  minio:
    image: minio/minio:latest
    container_name: railway-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  gateway:
    build:
      context: ./gateway
      dockerfile: ../Dockerfile
    container_name: railway-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/railway_gateway
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - railway-network

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

networks:
  railway-network:
    driver: bridge
